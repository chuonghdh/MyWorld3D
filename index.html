<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>MyWorld3D</title>
    <!-- Boot screen: shown from the first paint, before any script loads. src/ui/boot.ts hides it after the first
         rendered frame; errors before that turn it into an error panel (see the inline script below). -->
    <style>
      html, body { margin: 0; background: #1c1816; color: #f1ebe3; }
      .mw-boot {
        position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: #1c1816; transition: opacity 0.45s ease;
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .mw-boot.is-done { opacity: 0; pointer-events: none; }
      .mw-boot-card {
        display: flex; flex-direction: column; align-items: center; gap: 14px; max-width: 420px; width: 100%;
        box-sizing: border-box; padding: 22px 24px; border-radius: 16px; background: rgba(28, 24, 22, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45); text-align: center;
      }
      .mw-boot-spinner {
        width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid rgba(255, 255, 255, 0.12); border-top-color: #e8833a; animation: mw-boot-spin 0.9s linear infinite;
      }
      @keyframes mw-boot-spin { to { transform: rotate(360deg); } }
      .mw-boot-label { color: #a79c92; letter-spacing: 0.02em; }
      .mw-boot-title { margin: 0; font-size: 16px; font-weight: 600; color: #f1ebe3; }
      .mw-boot-msg {
        margin: 0; max-height: 30vh; overflow: auto; width: 100%; color: #a79c92; font: 12px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre-wrap; word-break: break-word;
      }
      .mw-boot-btn {
        min-height: 40px; padding: 8px 18px; border-radius: 10px; border: 1px solid #e8833a; cursor: pointer;
        background: rgba(232, 131, 58, 0.22); color: #f1ebe3; font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .mw-boot-btn:hover { background: rgba(232, 131, 58, 0.35); }
      @media (prefers-reduced-motion: reduce) {
        .mw-boot { transition: none; }
        .mw-boot-spinner { animation: none; border-color: #e8833a; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="mw-boot" class="mw-boot" role="status" aria-live="polite">
      <div class="mw-boot-card">
        <div class="mw-boot-spinner" aria-hidden="true"></div>
        <div class="mw-boot-label">Loading town…</div>
      </div>
    </div>
    <script>
      // Errors before the first frame (module load failures, stale transforms, render errors) replace the spinner
      // with an error panel instead of leaving a blank page. Later errors are left to the React error boundary.
      (function () {
        var boot = document.getElementById('mw-boot');
        var failed = false;
        function fail(message) {
          if (failed || !boot || !boot.isConnected || boot.classList.contains('is-done')) return;
          failed = true;
          boot.setAttribute('role', 'alert');
          var card = document.createElement('div');
          card.className = 'mw-boot-card';
          var title = document.createElement('h1');
          title.className = 'mw-boot-title';
          title.textContent = 'Something went wrong loading the town';
          var msg = document.createElement('p');
          msg.className = 'mw-boot-msg';
          msg.textContent = String(message || 'Unknown error').slice(0, 400);
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'mw-boot-btn';
          btn.textContent = 'Reload';
          btn.onclick = function () { location.reload(); };
          card.append(title, msg, btn);
          boot.replaceChildren(card);
        }
        window.__mwBootFail = fail;
        window.addEventListener('error', function (e) {
          // Resource load errors (img, script) have no message; the module script reports its own failure below.
          if (e && e.message) fail(e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          fail(r && r.message ? r.message : r);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx" onerror="window.__mwBootFail && window.__mwBootFail('The app script could not be loaded.')"></script>
  </body>
</html>
