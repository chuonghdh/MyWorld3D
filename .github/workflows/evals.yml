name: Evals

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node harness/scripts/run-evals.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-runs
          path: harness/runs/
          retention-days: 14
