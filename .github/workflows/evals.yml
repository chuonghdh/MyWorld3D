name: Evals

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node harness/scripts/run-evals.mjs
      - name: Open a harness issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Evals failed"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create harness --color B60205 --description "Harness failure feedback" 2>/dev/null || true
          if gh issue list --label harness --state open --limit 200 --json title --jq '.[].title' | grep -Fxq "$TITLE"; then
            echo "Open issue exists: $TITLE"
          else
            gh issue create --title "$TITLE" --label harness --body "Failing run: $RUN_URL. Picked up by the Improve section of harness/workflows/delivery.md."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: harness-runs
          path: harness/runs/
          retention-days: 14
