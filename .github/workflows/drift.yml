name: Drift check

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node harness/scripts/drift-check.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: drift-report
          path: harness/runs/drift-*.json
          retention-days: 14
          if-no-files-found: ignore
