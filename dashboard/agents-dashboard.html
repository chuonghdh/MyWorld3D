<meta name="claude:viewport-fit-sides" content="cover">
<title>MyWorld3D Agent Office</title>
<style>
/* Layout: a summary band on top, one card per agent in a responsive grid, and an event log below. */
:root {
  --bg: #15171c;
  --panel: #1d2028;
  --line: #2c313c;
  --fg: #ebe7df;
  --muted: #8e93a0;
  --accent: #f2a65a;
  --active: #5fd39a;
  --waiting: #f2c94c;
  --permission: #ff7a6b;
  --done: #7aa7ff;
  --sans: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f1ea; --panel: #fffdf8; --line: #e2ddd0; --fg: #23212a; --muted: #6c6a74;
    --accent: #c4641c; --active: #1f9d63; --waiting: #b8860b; --permission: #d1493b; --done: #3b6fd1;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f1ea; --panel: #fffdf8; --line: #e2ddd0; --fg: #23212a; --muted: #6c6a74;
  --accent: #c4641c; --active: #1f9d63; --waiting: #b8860b; --permission: #d1493b; --done: #3b6fd1;
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
h1, h2, p { margin: 0; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }

header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: end; }
.title { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.subtitle { color: var(--muted); font-size: 13px; }
.conn { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
.conn[data-state="live"] { color: var(--active); border-color: var(--active); }
.conn[data-state="error"] { color: var(--permission); border-color: var(--permission); }

.summary { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: grid; gap: 12px; }
.summary-top { display: flex; flex-wrap: wrap; gap: 18px; align-items: baseline; }
.big { font: 600 28px var(--mono); color: var(--accent); }
.stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.counts { display: flex; flex-wrap: wrap; gap: 14px; font: 13px var(--mono); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

.bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s ease; }

.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; grid-template-columns: 72px 1fr; gap: 14px; min-width: 0; }
.card[data-status="active"] { border-color: var(--active); }
.card[data-status="permission"] { border-color: var(--permission); }
.card[data-status="waiting"] { border-color: var(--waiting); }
.card[data-status="done"] { border-color: var(--done); }

.figure { position: relative; width: 72px; height: 90px; }
.avatar { width: 72px; height: 90px; image-rendering: pixelated; }
.bubble {
  position: absolute; top: -4px; right: -6px; min-width: 22px; height: 22px; padding: 0 6px;
  display: grid; place-items: center; background: var(--fg); color: var(--bg);
  border-radius: 11px; font: 600 13px var(--mono);
}

.meta { min-width: 0; display: grid; gap: 4px; align-content: start; }
.row { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.name { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.pill { font: 11px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.card[data-status="active"] .pill { color: var(--active); }
.card[data-status="permission"] .pill { color: var(--permission); }
.card[data-status="waiting"] .pill { color: var(--waiting); }
.card[data-status="done"] .pill { color: var(--done); }
.role { color: var(--muted); font-size: 12px; }
.activity { font: 12px/1.4 var(--mono); overflow-wrap: anywhere; min-height: 2.8em; margin-top: 4px; }
.progress-label { font: 11px var(--mono); color: var(--muted); display: flex; justify-content: space-between; margin-top: 6px; }

.log-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.log-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 320px; overflow: auto; }
.log li { display: grid; grid-template-columns: 74px 120px 1fr; gap: 10px; font: 12px/1.4 var(--mono); min-width: 0; }
.log time { color: var(--muted); }
.log .who { color: var(--accent); overflow-wrap: anywhere; }
.log .what { overflow-wrap: anywhere; }
@media (max-width: 520px) { .log li { grid-template-columns: 1fr; gap: 2px; } }

.empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="title">MyWorld3D Agent Office</div>
      <div class="subtitle">Live status of the agents building the city</div>
    </div>
    <span class="conn" id="conn" data-state="idle">Connecting…</span>
  </header>

  <section class="summary" aria-label="Overall progress">
    <div class="summary-top">
      <div>
        <div class="stat-label">Overall progress</div>
        <div class="big" id="overall">0%</div>
      </div>
      <div>
        <div class="stat-label">Agents</div>
        <div class="big" id="total">0</div>
      </div>
      <div>
        <div class="stat-label">Last update</div>
        <div class="big" style="font-size:16px;color:var(--fg)" id="last">—</div>
      </div>
    </div>
    <div class="bar" role="progressbar" aria-label="Overall progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="overall-bar"><span style="width:0%"></span></div>
    <div class="counts" id="counts"></div>
  </section>

  <main class="agents" id="agents" aria-live="polite"></main>

  <section class="log-panel" aria-label="Activity log">
    <div class="log-title">Activity log</div>
    <ol class="log" id="log"></ol>
  </section>
</div>

<script>
// Status colors and labels mirror the CSS tokens above.
const STATUS_LABEL = {
  active: 'Active',
  waiting: 'Waiting',
  permission: 'Needs approval',
  done: 'Done',
};
const BUBBLE = { permission: '…', done: '✓', waiting: '?' };
const PALETTE = ['#e0a96d', '#7fb7a4', '#c77dba', '#8aa1e0', '#e07a6a', '#b5c46a'];

const agents = new Map();
let frame = 0;

function h(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (key === 'class') node.className = value;
    else if (key === 'style') node.style.cssText = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) {
    if (child == null || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}

function setConn(state, text) {
  const el = document.getElementById('conn');
  el.dataset.state = state;
  el.textContent = text;
}

// Pixel character: a 16x20 grid scaled up by CSS. Active agents bob between two frames.
function drawAvatar(canvas) {
  const g = canvas.getContext('2d');
  const color = canvas.dataset.color;
  const bob = canvas.dataset.status === 'active' && frame % 2 ? -1 : 0;
  g.clearRect(0, 0, 16, 20);
  g.fillStyle = '#2b2f3a';
  g.fillRect(5, 14, 2, 4);
  g.fillRect(9, 14, 2, 4);
  g.fillStyle = color;
  g.fillRect(4, 8 + bob, 8, 7);
  g.fillRect(2, 9 + bob, 2, 5);
  g.fillRect(12, 9 + bob, 2, 5);
  g.fillStyle = '#f1c9a0';
  g.fillRect(5, 2 + bob, 6, 6);
  g.fillStyle = '#3a2a20';
  g.fillRect(5, 1 + bob, 6, 2);
  g.fillStyle = '#222';
  g.fillRect(6, 5 + bob, 1, 1);
  g.fillRect(9, 5 + bob, 1, 1);
}

function agentCard(a) {
  const pct = Math.max(0, Math.min(100, Number(a.progress) || 0));
  const status = STATUS_LABEL[a.status] ? a.status : 'waiting';
  const canvas = h('canvas', {
    class: 'avatar', width: 16, height: 20, 'aria-hidden': 'true',
    'data-color': PALETTE[(Number(a.seat) || 0) % PALETTE.length],
    'data-status': status,
  });
  return h('article', { class: 'card', 'data-status': status },
    h('div', { class: 'figure' },
      BUBBLE[status] ? h('span', { class: 'bubble' }, BUBBLE[status]) : null,
      canvas),
    h('div', { class: 'meta' },
      h('div', { class: 'row' },
        h('h2', { class: 'name' }, a.name || a.id),
        h('span', { class: 'pill' }, STATUS_LABEL[status])),
      h('p', { class: 'role' }, a.role || ''),
      h('p', { class: 'activity' }, a.activity || '—'),
      h('div', { class: 'bar', role: 'progressbar', 'aria-label': (a.name || a.id) + ' progress', 'aria-valuenow': pct, 'aria-valuemin': 0, 'aria-valuemax': 100 },
        h('span', { style: 'width:' + pct + '%' })),
      h('div', { class: 'progress-label' }, h('span', {}, 'Progress'), h('span', {}, pct + '%'))));
}

function renderAgents() {
  const list = [...agents.values()].sort((a, b) => (Number(a.seat) || 0) - (Number(b.seat) || 0));
  const root = document.getElementById('agents');
  root.replaceChildren();

  if (list.length === 0) {
    root.append(h('div', { class: 'empty' }, 'No agents yet. Their status appears here once the orchestrator writes it.'));
  } else {
    for (const a of list) {
      root.append(agentCard(a));
      drawAvatar(root.lastElementChild.querySelector('canvas'));
    }
  }

  const total = list.length;
  const avg = total ? Math.round(list.reduce((s, a) => s + (Number(a.progress) || 0), 0) / total) : 0;
  document.getElementById('overall').textContent = avg + '%';
  document.getElementById('total').textContent = String(total);
  const bar = document.getElementById('overall-bar');
  bar.setAttribute('aria-valuenow', String(avg));
  bar.firstElementChild.style.width = avg + '%';

  const counts = { active: 0, waiting: 0, permission: 0, done: 0 };
  for (const a of list) if (counts[a.status] !== undefined) counts[a.status]++;
  const countsEl = document.getElementById('counts');
  countsEl.replaceChildren();
  for (const key of Object.keys(counts)) {
    countsEl.append(h('span', {},
      h('span', { class: 'dot', style: 'background:var(--' + key + ')' }),
      STATUS_LABEL[key] + ' ' + counts[key]));
  }

  const updated = list.map(a => Number(a.updated) || 0).reduce((m, v) => Math.max(m, v), 0);
  document.getElementById('last').textContent = updated ? new Date(updated).toLocaleTimeString() : '—';
}

function renderLog(entries) {
  const root = document.getElementById('log');
  root.replaceChildren();
  if (entries.length === 0) {
    root.append(h('li', {}, h('span', { class: 'what' }, 'No events yet.')));
    return;
  }
  for (const e of entries) {
    root.append(h('li', {},
      h('time', {}, e.t ? new Date(e.t).toLocaleTimeString() : ''),
      h('span', { class: 'who' }, e.agent || ''),
      h('span', { class: 'what' }, e.text || '')));
  }
}

async function start() {
  let db = null;
  try {
    db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  } catch (_) {
    db = null;
  }
  if (!db) {
    setConn('error', 'Live data unavailable in this view');
    renderAgents();
    renderLog([]);
    return;
  }

  setConn('live', 'Live');
  db.collection('agents').onSnapshot(
    (snap) => {
      agents.clear();
      for (const d of snap.docs) {
        if (d.exists) agents.set(d.id, { id: d.id, ...d.data() });
      }
      renderAgents();
    },
    (err) => setConn('error', 'Error: ' + err.code),
  );
  db.collection('events').orderBy('t', 'desc').limit(30).onSnapshot(
    (snap) => renderLog(snap.docs.filter(d => d.exists).map(d => d.data())),
    (err) => setConn('error', 'Error: ' + err.code),
  );
}

// Animate pixel characters without re-rendering the cards.
setInterval(() => {
  frame++;
  document.querySelectorAll('canvas.avatar').forEach(drawAvatar);
}, 400);

renderAgents();
renderLog([]);
start();
</script>
